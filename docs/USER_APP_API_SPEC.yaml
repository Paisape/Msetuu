openapi: 3.0.3
info:
  title: Mandir Setu — User App API
  version: "1.0.0"
  description: |
    API reference for the customer-facing (devotee) mobile app only. Covers every endpoint the
    User app actually needs and that has a working backend today. Endpoints for the Priest and
    Astrologer companion apps are intentionally excluded — those apps have little to no backend
    built yet.

    ## Authentication
    The web app uses a NextAuth HttpOnly session cookie, which a native mobile app cannot store.
    Mobile clients use a short-lived access token + long-lived refresh token pair instead:

    1. `POST /mobile/login` with email + password (+ optional `deviceId`/`deviceName`/`os`).
    2. The response includes `accessToken` (valid 30 minutes) and `refreshToken` (valid 60
       days). Send the access token on every subsequent request as
       `Authorization: Bearer <accessToken>`.
    3. When a request fails with 401, call `POST /mobile/refresh` with the current
       `refreshToken` to get a new `accessToken` + a *new* `refreshToken` (it's rotated on every
       use — the old value stops working immediately, so hold onto only the newest one).
       Do this proactively before `expiresIn` runs out, not just reactively on 401, for a
       smooth UX.
    4. On sign-out, call `POST /mobile/logout` with the current `refreshToken` to revoke it
       server-side. `POST /mobile/logout-all` (🔒) revokes every device at once — wire this to a
       "log out everywhere" / "this wasn't me" action.

    Endpoints marked 🔒 require the `Authorization: Bearer <accessToken>` header. Endpoints with
    no lock are public.

    ### Client-side responsibilities (not enforceable by this backend, but required for a secure app)
    - **Never store `accessToken`/`refreshToken` in plain text.** Use Android's
      `EncryptedSharedPreferences`/Keystore or iOS Keychain — not plain `SharedPreferences`,
      `NSUserDefaults`, SQLite, or unencrypted files.
    - **Certificate pinning** is recommended for a payments-handling app to reduce MITM risk.
      Pin against this API's TLS certificate/public key.
    - The app should talk **only** to this backend — never directly to the database, and never
      embed the Razorpay `key_secret` (only the public `key_id` returned in `razorpayOrder` is
      meant for the client).

    ## Money
    All prices are in INR, as plain numbers (not paise/cents), e.g. `1499` means ₹1,499.
    Where both `price` and `offerPrice` are present, `offerPrice` (when set and lower) is the
    amount actually charged — always display `price` struck through and `offerPrice` as the
    real price in that case.

    ## Payments
    Every booking/order POST endpoint (Chadhava, E-Puja, Kundli, Jyotish, Ecommerce) creates the
    order as `PENDING` and returns a `razorpayOrder` object. Run Razorpay's Checkout SDK with
    those values, then call `POST /payment/verify` with the payment result to mark the order
    `PAID`. An order is never marked paid by any other endpoint.
servers:
  - url: https://www.mandirsetuu.com/api
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Content
    description: Banners, categories, FAQs, mantras, darshan temples — mostly
      public, read-only.
  - name: Chadhava
  - name: E-Puja
  - name: Kundli
  - name: Jyotish
    description: Astrologer directory and consultation bookings.
  - name: Astrology
    description: Standalone Vedic/Western astrology calculations (panchang, dasha,
      planets, horoscope, numerology, muhurat) — not tied to a paid consultation
      booking.
  - name: Ecommerce
  - name: Orders
    description: Cross-module order history, invoices, order-status trail, and
      payment verification.
  - name: Yatra
  - name: Geotag
    description: Temple-visit photo geo-tagging and the points/rewards program built
      on top of it.
  - name: Offers
    description: Standalone promo/campaign landing pages with their own pricing and
      order flow, separate from the regular catalog.
  - name: Reviews
  - name: Notifications
  - name: Contact

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                password:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Registration successful
        '400':
          description: Validation error
  /api/auth/login-precheck:
    post:
      summary: Precheck login credentials
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Precheck successful
        '401':
          description: Invalid credentials
  /api/auth/forgot-password:
    post:
      summary: Request a password reset OTP
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent
  /api/auth/reset-password:
    post:
      summary: Reset password using OTP
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password reset successful
  /api/auth/send-otp:
    post:
      summary: Send OTP for Passwordless Auth
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact:
                  type: string
                  example: user@example.com
                type:
                  type: string
                  enum: [EMAIL, SMS]
                  example: EMAIL
      responses:
        '200':
          description: OTP sent successfully
  /api/auth/verify-otp:
    post:
      summary: Verify OTP and Login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact:
                  type: string
                  example: user@example.com
                otp:
                  type: string
                  example: '123456'
                deviceId:
                  type: string
                  example: 'iphone12'
                deviceName:
                  type: string
                  example: 'My iPhone'
                os:
                  type: string
                  example: 'iOS'
      responses:
        '200':
          description: Verified successfully (returns mobile tokens and user info)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  isNewUser:
                    type: boolean
                    description: True if the user was just registered via passwordless OTP
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
                  refreshToken:
                    type: string
                  refreshExpiresIn:
                    type: integer
                  user:
                    $ref: '#/components/schemas/AuthUser'
  /mobile/login:
    post:
      tags: [ Auth ]
      summary: Log in and obtain an access + refresh token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                otp:
                  {
                    type: string,
                    description: "Only used if the account has 2FA/OTP-on-login enabled."
                  }
                deviceId:
                  {
                    type: string,
                    description: "Client-generated stable device identifier, for the
                      device-management screen."
                  }
                deviceName: { type: string, example: "Pixel 8" }
                os: { type: string, example: "Android 14" }
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    {
                      type: string,
                      description: "JWT — send as `Authorization: Bearer <accessToken>`. Short-lived."
                    }
                  expiresIn:
                    {
                      type: integer,
                      description: "Seconds until accessToken expires (1800 = 30 minutes)."
                    }
                  refreshToken:
                    {
                      type: string,
                      description: "Opaque long-lived token — store securely, exchange via POST
                        /mobile/refresh."
                    }
                  refreshExpiresIn:
                    {
                      type: integer,
                      description: "Seconds until refreshToken expires (60 days) if never used to
                        refresh."
                    }
                  user: { $ref: "#/components/schemas/AuthUser" }
        "400":
          description: Missing email/password
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts — back off and retry after the delay in the
            `Retry-After` header.

  /mobile/refresh:
    post:
      tags: [ Auth ]
      summary: Exchange a refresh token for a new access token
      security: []
      description: |
        Call this proactively before the current accessToken's `expiresIn` elapses (or
        reactively on a 401). The refresh token is rotated on every call — always persist the
        `refreshToken` from the response and discard the one you sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ refreshToken ]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, example: 1800 }
                  refreshToken:
                    {
                      type: string,
                      description: "New value — replaces the one you sent."
                    }
                  refreshExpiresIn: { type: integer, example: 5184000 }
        "400":
          description: Missing refreshToken
        "401":
          description: "refreshToken is invalid, expired, or was already revoked/rotated —
            send the user back to login."

  /mobile/logout:
    post:
      tags: [ Auth ]
      summary: Log out this device (revokes one refresh token)
      security: []
      description: "Call on sign-out. Idempotent — always returns success even for an
        already-invalid token, so it can't be used to probe for valid ones."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ refreshToken ]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /mobile/logout-all:
    post:
      tags: [ Auth ]
      summary: 🔒 Log out every device ("this wasn't me" / lost phone)
      description: "Revokes every refresh token on the account. Requires a
        currently-valid accessToken (unlike /mobile/logout) since we need to
        know whose sessions to kill."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /mobile/sessions:
    get:
      tags: [ Auth ]
      summary: 🔒 List this account's logged-in devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeviceSession" }

  "/mobile/sessions/{id}":
    delete:
      tags: [ Auth ]
      summary: 🔒 Revoke one device's session
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "404":
          description: Not found, or belongs to a different account

  /auth/register:
    post:
      tags: [ Auth ]
      summary: Create a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, email, password ]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                phone: { type: string }
      responses:
        "201":
          description: Account created — a 6-digit OTP was emailed to the address for
            verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      email: { type: string }
                      role: { type: string, enum: [ USER ] }
                      createdAt: { type: string, format: date-time }
                  requireVerification: { type: boolean, example: true }
        "400":
          description: Invalid name/email/password
        "409":
          description: An account with this email already exists

  /auth/verify-email:
    post:
      tags: [ Auth ]
      summary: Verify the email OTP sent at registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, otp ]
              properties:
                email: { type: string, format: email }
                otp:
                  {
                    type: string,
                    description: "6-digit code, valid 15 minutes."
                  }
      responses:
        "200":
          description: Verified (or already-verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        "400":
          description: Invalid or expired OTP

  /auth/login-precheck:
    post:
      tags: [ Auth ]
      summary: Check credentials and whether an OTP step is required before logging in
      description: "Call this before POST /mobile/login. If the account is an admin
        and OTP-on-login is enabled server-side, this emails a 10-minute OTP and
        returns requireOtp:true — pass that OTP through the login call. Regular
        users always get requireOtp:false."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Credentials valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  requireOtp: { type: boolean }
                  email:
                    {
                      type: string,
                      description: "Only present when requireOtp is true."
                    }
        "400": { description: "Missing email/password" }
        "401": { description: "Invalid credentials" }
        "403": { description: "Email not verified yet" }
        "429":
          {
            description: "Too many attempts — rate limited (10 per 10 minutes per email)"
          }

  /auth/forgot-password:
    post:
      tags: [ Auth ]
      summary: Request a password-reset OTP by email
      description: "Always returns success (even if the email doesn't exist) to avoid
        leaking which emails are registered. If the account exists, a 6-digit
        OTP valid for 15 minutes is emailed."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Always returned, regardless of whether the email exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        "429":
          {
            description: "Too many attempts — rate limited (5 per hour per email)"
          }

  /auth/reset-password:
    post:
      tags: [ Auth ]
      summary: Reset the password using the OTP from /auth/forgot-password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, otp, newPassword ]
              properties:
                email: { type: string, format: email }
                otp:
                  {
                    type: string,
                    description: "6-digit code from the forgot-password email, valid 15 minutes."
                  }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Password reset — also marks the account as email-verified if it
            wasn't already
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        "400":
          {
            description: "Missing fields, password under 8 characters, no pending reset, or
              expired/invalid OTP"
          }
        "429":
          {
            description: "Too many attempts — rate limited (10 per 10 minutes per email)"
          }

  /login:
    post:
      tags: [ Auth ]
      summary: Direct credential login (internal endpoint also used by NextAuth/mobile
        login)
      description: |
        Prefer `POST /mobile/login` for mobile clients — it wraps this same credential check and
        also mints the access/refresh token pair. This endpoint just verifies credentials and
        returns the bare user object; it does not issue tokens. Note: unlike every other endpoint
        in this API, error responses use `{ message: string[] }` instead of `{ error: string }`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                otp:
                  {
                    type: string,
                    description: "Required only for admin accounts when OTP-on-login is enabled —
                      get it from /auth/login-precheck first."
                  }
      responses:
        "200":
          description: Credentials valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string, nullable: true }
                  email: { type: string }
                  image: { type: string, nullable: true }
                  role: { type: string, enum: [ USER, ADMIN, ASTROLOGER ] }
        "401":
          description: Invalid credentials, or (admin) missing/expired/invalid OTP
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { message: { type: array, items: { type: string } } }
                }
        "403":
          description: Email not verified
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { message: { type: array, items: { type: string } } }
                }
        "429":
          {
            description: "Too many attempts — rate limited (10 per 10 minutes per email)"
          }

  /banners:
    get:
      tags: [ Content ]
      summary: Get active banners for a page
      security: []
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string }
          description: "e.g. home, chadhava, epuja, jyotish, kundli, ecommerce, yatra,
            darshan, geotag, login, register"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Banner" }

  /categories:
    get:
      tags: [ Content ]
      summary: Get the admin-curated category list for a module
      security: []
      parameters:
        - name: module
          in: query
          required: true
          schema: { type: string, enum: [ epuja, ecommerce ] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }

  /faqs:
    get:
      tags: [ Content ]
      summary: Get FAQs for a page
      description: "When `listingId` is supplied, the response merges that listing's
        own FAQs with module-wide ones (listingId is null) so a listing detail
        page shows both without admin duplicating general FAQs onto every item."
      security: []
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string }
        - name: listingId
          in: query
          required: false
          schema: { type: string }
          description: "Optional — scope to FAQs for one specific listing plus module-wide
            ones."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Faq" }

  /mantra:
    get:
      tags: [ Content ]
      summary: Get all aartis/mantras (audio player content)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mantra" }

  /darshan:
    get:
      tags: [ Content ]
      summary: Get all Darshan temples (banner, QR code, 3D experience link)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DarshanTemple" }

  "/darshan/{id}":
    get:
      tags: [ Content ]
      summary: Get one Darshan temple by id
      security: []
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DarshanTemple" }
        "404": { description: Not found }

  /darshan-daily:
    get:
      tags: [ Content ]
      summary: Get the daily-darshan schedule (one deity/bhajan per day of week), or
        one day's entry
      security: []
      parameters:
        - name: day
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 6 }
          description: "0=Sunday..6=Saturday. If passed, returns a single object (or null)
            for that day instead of the full week's array."
      responses:
        "200":
          description: "Array of DailyDarshan (no `day` param) or a single DailyDarshan /
            null (with `day`)"
          content:
            application/json:
              schema:
                oneOf:
                  - {
                      type: array,
                      items: { $ref: "#/components/schemas/DailyDarshan" }
                    }
                  - { $ref: "#/components/schemas/DailyDarshan" }
                  - { type: "null" }
        "400": { description: "day out of range 0-6" }

  "/darshan-daily/{id}":
    get:
      tags: [ Content ]
      summary: Get one daily-darshan entry by id
      security: []
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyDarshan" }
        "404": { description: Not found }

  /how-it-works:
    get:
      tags: [ Content ]
      summary: Get the "How It Works" steps for a page
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: string }
          description: "e.g. chadhava, epuja, jyotish, kundli, yatra. Omit for all pages."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HowItWorksStep" }

  /vr:
    get:
      tags: [ Content ]
      summary: Browse 360° VR temple media
      security: []
      parameters:
        - name: includeAll
          in: query
          required: false
          schema: { type: string, enum: [ "true" ] }
          description: "Pass true to also include inactive items (no auth required for
            this — public flag)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VrMedia" }

  "/vr/{slug}":
    get:
      tags: [ Content ]
      summary: Get one VR media item by slug (or id)
      description: "Increments the item's viewsCount as a side effect."
      security: []
      parameters:
        - {
            name: slug,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VrMedia" }
        "404": { description: Not found }

  /content/about:
    get:
      tags: [ Content ]
      summary: Get the About Us page content
      security: []
      responses:
        "200":
          description: "OK — served from a JSON file with a hardcoded fallback if
            unconfigured, so this never 404s."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AboutUsData" }

  /shop-purposes:
    get:
      tags: [ Content ]
      summary: Get the "Shop by Purpose" tiles (Wealth, Health, etc.) shown on the
        homepage/Ecommerce filters
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShopPurpose" }

  /chadhava/listings:
    get:
      tags: [ Chadhava ]
      summary: Browse Chadhava offerings
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
