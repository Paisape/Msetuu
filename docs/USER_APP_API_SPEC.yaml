  /jyotish:
    get:
      tags: [ Jyotish ]
      summary: 🔒 My consultation bookings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsultationBooking" }
    post:
      tags: [ Jyotish ]
      summary: 🔒 Book a consultation
      description: |
        Single booking form (gemsmantra.com/pages/consultation style) — no astrologer browsing
        and no calendar date/time-slot picker on this endpoint. `category` must match an active
        JyotishCategory.name and determines the life-area classification (a separate `purpose`
        field previously existed but was removed since it duplicated `category`). `durationMins`
        (30/60/90) selects the session-length tier — price is `category`'s price for that
        specific duration (e.g. Kundli Reading at 60 min may cost differently than the same
        category at 30 min). Payment is always required — a Razorpay order is created and
        returned on every successful booking, and admin assigns an astrologer + the actual
        calendar slot afterward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  category,
                  durationMins,
                  name,
                  email,
                  phone,
                  dob,
                  timeOfBirth,
                  placeOfBirth,
                  comment
                ]
              properties:
                category:
                  {
                    type: string,
                    description: "Must match an active JyotishCategory.name, e.g. Kundli Reading,
                      Vastu Consultation, Numerology."
                  }
                durationMins:
                  {
                    type: integer,
                    enum: [ 30, 60, 90 ],
                    description: "Session length — determines which of the category's three price
                      tiers applies."
                  }
                comment:
                  {
                    type: string,
                    description: "Description of the problem/question — minimum 10 words."
                  }
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                dob: { type: string, format: date }
                timeOfBirth: { type: string }
                placeOfBirth: { type: string }
      responses:
        "201":
          description: Booking created — payment required to complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: "#/components/schemas/ConsultationBooking" }
                  razorpayOrder: { $ref: "#/components/schemas/RazorpayOrder" }
        "400":
          {
            description: "Missing/invalid fields, durationMins not one of 30/60/90, or
              comment under 10 words"
          }
        "404": { description: "Selected category is not available" }
        "503": { description: "Online payments are not configured yet" }

