          items:
            {
              type: object,
              properties:
                {
                  label: { type: string },
                  value: { type: string },
                  icon: { type: string }
                }
            }
        pillars:
          type: array
          items:
            {
              type: object,
              properties:
                {
                  title: { type: string },
                  description: { type: string },
                  icon: { type: string }
                }
            }
        team:
          type: array
          items:
            {
              type: object,
              properties:
                {
                  name: { type: string },
                  role: { type: string },
                  bio: { type: string },
                  image: { type: string }
                }
            }
        updatedAt: { type: string, format: date-time, nullable: true }

    DailyDarshan:
      type: object
      properties:
        id: { type: string }
        dayOfWeek:
          {
            type: integer,
            minimum: 0,
            maximum: 6,
            description: "0=Sunday..6=Saturday."
          }
        deityName: { type: string }
        image: { type: string }
        bhajanTitle: { type: string, nullable: true }
        bhajanUrl: { type: string, nullable: true }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConsultationTimeSlot:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        startTime: { type: string, description: "HH:mm, 24-hour." }
        order: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    ShopPurpose:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        image: { type: string }
        order: { type: integer }
        createdAt: { type: string, format: date-time }

    Offer:
      type: object
      description: "A promo/campaign landing page (e.g. a festival special) with its
        own slug, pricing, and order flow — separate from the regular catalog
        listings."
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        headerImage: { type: string }
        details: { type: string, description: "HTML content." }
        pricingType: { type: string, enum: [ FLAT, PER_PERSON, PACKAGE ] }
        salePrice: { type: number }
        offerPrice: { type: number, nullable: true }
        packages:
          type: array
          nullable: true
          description: "Only present when pricingType is PACKAGE."
          items:
            {
              type: object,
              properties:
                {
                  name: { type: string },
                  salePrice: { type: number },
                  offerPrice: { type: number, nullable: true }
                }
            }
        gstPercentage: { type: number }
        gstInclusive: { type: boolean }
        active: { type: boolean }
        visitsCount: { type: integer }
        createdAt: { type: string, format: date-time }

    OfferOrder:
      type: object
      properties:
        id: { type: string }
        offerId: { type: string }
        userId:
          {
            type: string,
            nullable: true,
            description: "Null for guest checkout."
          }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        comment: { type: string, nullable: true }
        packageName:
          {
            type: string,
            nullable: true,
            description: "Set when the offer's pricingType is PACKAGE."
          }
        personCount: { type: integer }
        devotees:
          type: array
          nullable: true
          description: "Set when the offer's pricingType is PER_PERSON."
          items:
            {
              type: object,
              properties: { name: { type: string }, gotra: { type: string } }
            }
        amountPaid: { type: number }
        gstPercentage: { type: number }
        gstInclusive: { type: boolean }
        paymentStatus: { type: string, enum: [ PENDING, PAID, FAILED ] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        offer: { $ref: "#/components/schemas/Offer" }

    Refund:
      type: object
      properties:
        id: { type: string }
        invoiceId: { type: string }
        amount: { type: number }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [ INITIATED, PROCESSED ] }
        processedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Invoice:
      type: object
      properties:
        id: { type: string }
        invoiceNumber: { type: string }
        orderType:
          {
            type: string,
            enum: [ CHADHAVA, EPUJA, JYOTISH, KUNDLI, ECOMMERCE, YATRA ]
          }
        orderId: { type: string }
        userId: { type: string }
        customerName: { type: string }
        customerEmail: { type: string, nullable: true }
        itemLabel: { type: string }
        subtotal: { type: number }
        gstPercentage: { type: number }
        gstAmount: { type: number }
        total: { type: number }
        status: { type: string, enum: [ PAID, CANCELLED ] }
        issuedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        refund:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/Refund" },
                { type: "null" }
              ]
          }

    OrderTrailEntry:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        actorName: { type: string }
        actorRole: { type: string, enum: [ ADMIN, SYSTEM, USER ] }
        ip:
          {
            type: string,
            nullable: true,
            description: "Only present when the caller is an admin — omitted for regular
              customers viewing their own trail."
          }
        userAgent:
          {
            type: string,
            nullable: true,
            description: "Only present when the caller is an admin — omitted for regular
              customers viewing their own trail."
          }
