            isn't set up yet"
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      configured: { type: boolean },
                      date: { type: string },
                      message: { type: string, nullable: true }
                    },
                  additionalProperties: true
                }
        "400": { description: "Invalid date" }
        "502": { description: "Upstream provider error" }

  /horoscope:
    get:
      tags: [ Astrology ]
      summary: Rashi (Vedic moon-sign) horoscope prediction — separate from
        /astrology/horoscope (Western zodiac sign)
      security: []
      parameters:
        - {
            name: rashi,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum:
                  [
                    mesha,
                    vrishabha,
                    mithuna,
                    karka,
                    simha,
                    kanya,
                    tula,
                    vrishchika,
                    dhanu,
                    makara,
                    kumbha,
                    meena
                  ]
              }
          }
        - {
            name: period,
            in: query,
            required: false,
            schema:
              {
                type: string,
                enum: [ today, tomorrow, week, month ],
                default: today
              }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      rashi: { type: string },
                      period: { type: string },
                      sign: { type: string }
                    },
                  additionalProperties: true
                }
        "400": { description: "Missing/invalid rashi or period" }
        "502": { description: "Upstream provider error" }

  /numerology:
    get:
      tags: [ Astrology ]
      summary: Numerology profile from name + date of birth (computed locally, no
        external API)
      security: []
      parameters:
        - {
            name: name,
            in: query,
            required: true,
            schema: { type: string, maxLength: 200 }
          }
        - {
            name: dob,
            in: query,
            required: true,
            schema: { type: string, format: date },
            description: "YYYY-MM-DD."
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      configured: { type: boolean, example: true },
                      name: { type: string },
                      dob: { type: string }
                    },
                  additionalProperties: true
                }
        "400": { description: "Missing/invalid name or dob" }

  "/offer/{slug}":
    get:
      tags: [ Offers ]
      summary: Get a promo/campaign offer landing page
      security: []
      parameters:
        - {
            name: slug,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "404": { description: "Not found, or the offer is inactive" }
    post:
      tags: [ Offers ]
      summary: Record a page visit for this offer (analytics beacon)
      description: "Fire this once when the offer landing page loads. No request body
        needed."
      security: []
      parameters:
        - {
            name: slug,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { success: { type: boolean } }
                }
        "404": { description: "Offer not found (any status)" }

  "/offer/{slug}/order":
    post:
      tags: [ Offers ]
      summary: Place an order for a promo offer (guest checkout allowed)
      description: "If the caller is logged in, the order is linked to their account;
        otherwise it's a guest order (userId is null). Always creates a Razorpay
        order — verify it the same way as every other module, via POST
        /payment/verify with orderType: OFFER and this order's id."
      security: []
      parameters:
        - {
            name: slug,
            in: path,
            required: true,
            schema: { type: string }
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, email, phone ]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                comment: { type: string }
                packageName:
                  {
                    type: string,
                    description: "Required if the offer's pricingType is PACKAGE — must match one of
                      Offer.packages[].name."
                  }
                devotees:
                  type: array
                  description: "Required, non-empty, if the offer's pricingType is PER_PERSON.
                    personCount = devotees.length, and amountPaid = offerPrice ×
                    personCount."
                  items:
                    {
                      type: object,
                      properties: { name: { type: string }, gotra: { type: string } }
                    }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/OfferOrder" }
                  razorpayOrder: { $ref: "#/components/schemas/RazorpayOrder" }
        "400":
          {
            description: "Missing name/email/phone, missing devotees for a PER_PERSON offer,
              or missing/invalid packageName for a PACKAGE offer"
          }
        "404": { description: "Offer not found or inactive" }
        "503": { description: "Online payments are not configured yet" }

  /ecommerce/products:
    get:
      tags: [ Ecommerce ]
      summary: Browse products
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: purpose, in: query, schema: { type: string } }
        - { name: planet, in: query, schema: { type: string } }
        - {
            name: bestseller,
            in: query,
            schema: { type: string, enum: [ "1" ] },
            description: "Pass 1 to filter to Best Sellers only."
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /ecommerce:
    get:
      tags: [ Ecommerce ]
      summary: 🔒 My product orders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductOrder" }
    post:
      tags: [ Ecommerce ]
      summary: 🔒 Place a product order (creates a PENDING order + Razorpay order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ productId, address ]
              properties:
                productId: { type: string }
                quantity: { type: integer, default: 1, minimum: 1, maximum: 20 }
                carat:
                  {
                    type: number,
                    description: "Required, 3.5–12.5, only for products in the Gemstones category."
                  }
                address: { type: string, description: "Shipping address." }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/ProductOrder" }
                  razorpayOrder: { $ref: "#/components/schemas/RazorpayOrder" }
        "400":
          {
            description: "Missing fields, or invalid carat for a gemstone product"
          }
        "404": { description: Product not found }

  "/ecommerce/{id}":
    get:
      tags: [ Ecommerce ]
      summary: 🔒 Get one of my product orders
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductOrder" }
        "403": { description: "Order belongs to a different user" }
        "404": { description: Not found }

  /my-orders:
    get:
      tags: [ Orders ]
      summary: 🔒 My orders across every module, in one list
      description: "Use this to render a unified 'My Orders' screen. Fetch per-module
        detail from that module's GET endpoint using `targetId`/`id` when the
        user opens one."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyOrderEntry" }

  /addresses:
    get:
      tags: [ Orders ]
      summary: 🔒 My saved address book (default address first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Address" }
    post:
      tags: [ Orders ]
      summary: 🔒 Save a new address to my address book
      description: "The first address a user ever saves always becomes the default
        automatically, regardless of `isDefault` sent."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ fullAddress ]
              properties:
                label:
                  {
                    type: string,
                    nullable: true,
                    description: "Optional nickname, e.g. \"Home\", \"Work\". Max 40 characters."
                  }
                fullAddress: { type: string, description: "5-500 characters." }
                isDefault:
                  {
                    type: boolean,
                    description: "If true, unsets any previous default and makes this one the
                      default."
                  }
      responses:
        "201":
          description: Address saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400":
          {
            description: "Missing/invalid fields, or the 20-address-per-user limit was
              reached"
          }

  "/addresses/{id}":
    patch:
      tags: [ Orders ]
      summary: 🔒 Edit one of my saved addresses, or set it as default
      description: "isDefault can only be set to true here (to make this address the
        new default) — to remove a default, set a different address as default
        instead."
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string }
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, nullable: true }
                fullAddress: { type: string, description: "5-500 characters." }
                isDefault: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "404":
          {
            description: "Address not found, or does not belong to the caller"
          }
    delete:
      tags: [ Orders ]
      summary: 🔒 Delete one of my saved addresses
      description: "If the deleted address was the default and other saved addresses
        remain, the most recently updated one is automatically promoted to
        default."
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { success: { type: boolean } }
                }
        "404":
          {
            description: "Address not found, or does not belong to the caller"
          }

  /my-orders/addresses:
    get:
      tags: [ Orders ]
      summary: 🔒 My past shipping addresses (legacy autofill list)
      description: |
        Superseded by `GET /addresses` (the real address book) — kept for backward
        compatibility only. Returns distinct `shippingAddress` strings pulled from the user's
        own past Ecommerce orders (`ProductOrder.shippingAddress`), most recent first. New
        clients should use `/addresses` instead, which supports add/edit/delete/set-default.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: [ "123 Example Street, City, State, 400001" ]

  /payment/verify:
    post:
      tags: [ Orders ]
      summary: 🔒 Verify a Razorpay payment and mark the order PAID
      description: "Call this from the Razorpay Checkout success handler. This is the
        only endpoint that ever marks an order PAID."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  orderType,
                  orderId,
                  razorpayPaymentId,
                  razorpayOrderId,
                  razorpaySignature
                ]
              properties:
                orderType:
                  {
                    type: string,
                    enum: [ CHADHAVA, EPUJA, JYOTISH, KUNDLI, ECOMMERCE, OFFER ]
                  }
                orderId: { type: string }
                razorpayPaymentId: { type: string }
                razorpayOrderId: { type: string }
                razorpaySignature: { type: string }
      responses:
        "200":
          description: Verified and marked PAID
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  orderId: { type: string }
        "400":
          {
            description: "Missing fields, signature invalid, or razorpayOrderId doesn't
              match this order"
          }
        "403": { description: "This order doesn't belong to you" }
        "409": { description: "Already paid" }

  /invoices:
    get:
      tags: [ Orders ]
      summary: 🔒 My invoices
      description: "Regular users always see only their own invoices, regardless of
        filters used — the userId scope is forced server-side. An admin caller
        sees every user's invoices matching the filters instead."
      parameters:
        - {
            name: status,
            in: query,
            required: false,
            schema: { type: string, enum: [ PAID, CANCELLED ] }
          }
        - {
            name: orderType,
            in: query,
            required: false,
            schema:
              {
                type: string,
                enum: [ CHADHAVA, EPUJA, JYOTISH, KUNDLI, ECOMMERCE, YATRA ]
              }
          }
        - {
            name: orderId,
            in: query,
            required: false,
            schema: { type: string }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }

  "/invoices/{id}":
    get:
      tags: [ Orders ]
      summary: 🔒 Get one of my invoices
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "403": { description: "Invoice belongs to a different user" }
        "404": { description: Not found }

  /orders/trail:
    get:
      tags: [ Orders ]
      summary: 🔒 Status-change history for one order (audit trail)
      description: "Use this to render an order-tracking timeline. The
        `ip`/`userAgent` fields on each entry are only populated when the caller
        is an admin — they are omitted for regular customers viewing their own
        trail."
      parameters:
        - {
            name: type,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum: [ CHADHAVA, EPUJA, JYOTISH, KUNDLI, ECOMMERCE, YATRA ]
              }
          }
        - {
            name: id,
            in: query,
            required: true,
            schema: { type: string },
            description: "The order id."
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderTrailEntry" }
        "400": { description: "Missing/invalid type or id" }
        "403": { description: "Order belongs to a different user" }

  /yatra:
    get:
      tags: [ Yatra ]
      summary: 🔒 My Yatra (pilgrimage tour) booking requests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/YatraBooking" }
    post:
      tags: [ Yatra ]
      summary: 🔒 Submit a Yatra booking request
      description: "No payment step — this is a lead-capture form; the team follows up
        to arrange the actual tour."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  name,
                  contactNumber,
                  cityOfDeparture,
                  destination,
                  travelDate
                ]
              properties:
                name: { type: string }
                contactNumber: { type: string }
                cityOfDeparture: { type: string }
                destination: { type: string }
                totalTravelers: { type: integer, default: 1, minimum: 1 }
                travelDate: { type: string, format: date }
                comment: { type: string }
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YatraBooking" }
        "400": { description: "Missing/invalid fields" }

  "/yatra/{id}":
    get:
      tags: [ Yatra ]
      summary: 🔒 Get one of my Yatra booking requests
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string }
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YatraBooking" }
        "403": { description: "Booking belongs to a different user" }
        "404": { description: Not found }

  /geotag:
    get:
      tags: [ Geotag ]
      summary: My geo-tagged temple-visit photos, or the public approved map
      description: "🔒 with no params: the caller's own tags (any status). With
        `?public=1` (no auth needed): every APPROVED tag, for the public
        community map — never exposes who submitted it."
      security: []
      parameters:
        - name: public
          in: query
          required: false
          schema: { type: string, enum: [ "1" ] }
          description: "Pass 1 for the public, unauthenticated approved-tags map."
      responses:
        "200":
          description: "Array of GeoTagPhoto (🔒 own tags) or a reduced public shape (id,
            imageUrl, templeName, latitude, longitude, createdAt) when public=1"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GeoTagPhoto" }
    post:
      tags: [ Geotag ]
      summary: 🔒 Share a geo-tagged photo
      description: |
        Upload the actual image file first via `POST /upload/review-media` to get `imageUrl`,
        then call this. Rate-limited to 20 submissions/hour. `templeName` is auto-suggested
        server-side from `latitude`/`longitude` (never trusted from the client's own "detected"
        claim) — if no match is found nearby, the visitor must enter one manually. Starts
        PENDING; points are awarded only once an admin approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ imageUrl ]
              properties:
                imageUrl: { type: string }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                templeName:
                  {
                    type: string,
                    maxLength: 150,
                    description: "Required if no temple could be auto-suggested from
                      latitude/longitude."
                  }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoTagPhoto" }
        "400":
          {
            description: "Missing imageUrl, out-of-range coordinates, or no templeName could
              be determined"
          }
        "429":
          {
            description: "Too many submissions — rate limited (20 per hour)"
          }

  /geotag/nearest:
    get:
      tags: [ Geotag ]
      summary: Find the nearest known temple to a coordinate (for auto-filling
        templeName)
      security: []
      parameters:
        - {
            name: lat,
            in: query,
            required: true,
            schema: { type: number, minimum: -90, maximum: 90 }
          }
        - {
            name: lng,
            in: query,
            required: true,
            schema: { type: number, minimum: -180, maximum: 180 }
          }
      responses:
        "200":
          description: "OK — temple is null if none is within range, never errors for 'no
            match'"
          content:
            application/json:
              schema:
                type: object
                properties:
                  temple:
                    {
                      type: object,
                      nullable: true,
                      properties: { name: { type: string }, distanceKm: { type: number } }
                    }
                  pointsPerTag: { type: integer }
        "400": { description: "Missing or out-of-range lat/lng" }

  /geotag/settings:
    get:
      tags: [ Geotag ]
      summary: Get the current points-per-tag reward rate
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { pointsPerTag: { type: integer } }
                }

  /geotag/points:
    get:
      tags: [ Geotag ]
      summary: 🔒 My points balance and ledger
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  points: { type: integer, description: "Current running balance." }
                  transactions:
                    type: array
                    maxItems: 100
                    description: "Most recent 100 entries, newest first."
                    items: { $ref: "#/components/schemas/PointsTransaction" }

  /geotag/redemption-slabs:
    get:
      tags: [ Geotag ]
      summary: Browse active redemption slabs (points required per rewardable product)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    pointsRequired: { type: integer }
                    productId: { type: string }
                    active: { type: boolean }
                    createdAt: { type: string, format: date-time }
                    product:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        image: { type: string }
                        price: { type: number }

  /geotag/redeem:
    post:
      tags: [ Geotag ]
      summary: 🔒 Redeem points for a slab's product
      description: "Points are deducted atomically the moment the request is created
        (not on admin approval), so two concurrent requests can't both spend the
        same points. Rate-limited to 20/hour."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ slabId ]
              properties:
                slabId: { type: string }
                shippingAddress: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Redemption request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedemptionRequest" }
        "400": { description: "Missing slabId, or insufficient points" }
        "404": { description: "Slab not found or inactive" }
        "429":
          {
            description: "Too many attempts — rate limited (20 per hour)"
          }

  /geotag/redemptions:
    get:
      tags: [ Geotag ]
      summary: 🔒 My redemption requests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RedemptionRequest" }

  /upload/review-media:
    post:
      tags: [ Geotag ]
      summary: 🔒 Upload an image or short video (multipart/form-data)
      description: |
        Used for geotag photos and review media. Field name must be `file`. Images: JPEG/PNG/WebP/GIF
        up to 15MB (auto re-compressed to WebP). Videos: MP4/WebM/MOV up to 30MB, stored as-is.
        This is NOT the same endpoint as the admin catalog uploader — this one is open to any
        logged-in user.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    {
                      type: string,
                      description: "Relative path, e.g. /uploads/reviews/xxxx.webp — prefix with the
                        server origin to display."
                    }
                  type: { type: string, enum: [ image, video ] }
        "400":
          {
            description: "No file, unsupported type, or exceeds the size limit"
          }

  /reviews:
    get:
      tags: [ Reviews ]
      summary: Get reviews
      security: []
      description: |
        Two usage modes:
        - `orderType` + `targetId` (public): approved reviews for a listing/product/astrologer, plus average rating and count.
        - `orderType` + `orderId` (🔒 requires auth): the logged-in user's own review for that specific order, to show "you already reviewed this".
      parameters:
        - {
            name: orderType,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum: [ CHADHAVA, EPUJA, KUNDLI, JYOTISH, ECOMMERCE ]
              }
          }
        - {
            name: targetId,
            in: query,
            schema: { type: string },
            description: "The listing/product/astrologer id — use with orderType for public
              reviews."
          }
        - {
            name: orderId,
            in: query,
            schema: { type: string },
            description: "Use with orderType (and auth) to fetch your own review for that
              order."
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      reviews:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Review" }
                        }
                      averageRating: { type: number }
                      count: { type: integer }
                  - type: object
                    properties:
                      review:
                        oneOf:
                          - { $ref: "#/components/schemas/Review" }
                          - { type: "null" }
        "400":
          {
            description: "orderType and either orderId or targetId are required"
          }
    post:
      tags: [ Reviews ]
      summary: 🔒 Submit a review for a completed (PAID) order
      description: "Verified-purchase only — the order is looked up server-side by
        orderId and must belong to the caller and be PAID. One review per order
        (a second attempt returns 409)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ orderType, orderId, rating ]
              properties:
                orderType:
                  {
                    type: string,
                    enum: [ CHADHAVA, EPUJA, KUNDLI, JYOTISH, ECOMMERCE ]
                  }
                orderId: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 1000 }
                media:
                  type: array
                  maxItems: 5
                  description: "Must be URLs returned by POST /upload/review-media — any other URL
                    is rejected."
                  items:
                    type: object
                    properties:
                      url: { type: string }
                      type: { type: string, enum: [ image, video ] }
      responses:
        "201":
          description: Review submitted (starts as PENDING, awaiting admin approval before
            it's public)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "403": { description: "Not your order, or order isn't PAID yet" }
        "404": { description: Order not found }
        "409": { description: "You already reviewed this order" }

  /notifications/firebase/token:
    post:
      tags: [ Notifications ]
      summary: 🔒 Register this device's push token
      description: "Call after login (and whenever Firebase issues a new token) so the
        backend can send this user push notifications."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ fcmToken ]
              properties:
                fcmToken: { type: string }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /contact:
    post:
      tags: [ Contact ]
      summary: Submit a Contact Us / support message
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, email, message ]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 254 }
                message: { type: string, maxLength: 3000 }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "400": { description: "Missing/invalid fields" }
  "/reviews/{id}":
    patch:
      summary: Update Review
      tags:
        - Reviews
      responses:
        "200":
          description: Successful response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: number
    delete:
      summary: Delete Review
      tags:
        - Reviews
      responses:
        "200":
          description: Successful response
  /geotag/temples:
    get:
      summary: Get Geotag Temples
      tags:
        - Geotag Rewards
      responses:
        "200":
          description: Successful response
  /refunds:
    get:
      summary: My Refunds
      tags:
        - Orders & Invoices
      responses:
        "200":
          description: Successful response
  /legal/terms:
    get:
      summary: Terms and Conditions
      tags:
        - Legal & Contact
      responses:
        "200":
          description: Successful response
  /notifications/history:
    get:
      summary: My Notifications History
      tags:
        - Notifications
      responses:
        "200":
          description: Successful response

